<aside class="sidebar">
  <div class="sidebar-top">
    <a routerLink="/" class="brand" matRipple>
      <img src="/Collab AI.svg" class="brand-logo" alt="Collab AI" />
    </a>
    
    <nav class="nav">
      @for (page of pages; track page.key) {
        <a 
          [routerLink]="['/' + page.key]" 
          routerLinkActive="active" 
          class="nav-item" 
          matRipple
        >
          <span class="material-symbols-rounded">{{ page.icon }}</span>
          <span>{{ page.label }}</span>
        </a>
      }
    </nav>

    <button
      type="button"
      class="command-launch"
      (click)="commandCenter.open()"
      matRipple
      aria-label="Open command center"
    >
      <span class="material-symbols-rounded" aria-hidden="true">search</span>
      <span>Search &amp; commands</span>
      <kbd><span class="command-key">⌘</span>K</kbd>
    </button>

    <div class="section-label">
      Projects
      <button
        type="button"
        class="icon-btn"
        matRipple
        (click)="workspace.toggleWorkspaceCreator()"
        [attr.aria-label]="workspace.isWorkspaceCreatorOpen() ? 'Close new project form' : 'New project'"
        [title]="workspace.isWorkspaceCreatorOpen() ? 'Close' : 'New project'"
        style="background: none; border: none; cursor: pointer; color: inherit; display: inline-flex; align-items: center; padding: 2px;"
      >
        <span class="material-symbols-rounded" style="font-size: 16px;">{{ workspace.isWorkspaceCreatorOpen() ? 'close' : 'add' }}</span>
      </button>
    </div>

    <div class="workspaces">
      @for (ws of workspace.workspaces(); track ws.id) {
        <button 
          class="ws-item" 
          [class.active]="ws.id === workspace.selectedWorkspaceId()"
          (click)="selectWorkspace(ws.id)"
          matRipple
          style="border: none; background: transparent; width: 100%; font-family: inherit;"
        >
          <div class="ws-dot" [style.background]="ws.accent"></div>
          <span class="ws-name">{{ ws.name }}</span>
        </button>
      }

      @if (workspace.isWorkspaceCreatorOpen()) {
        <div class="ws-create">
          <input
            #wsInput
            type="text"
            [value]="workspace.newWorkspaceName()"
            (input)="workspace.newWorkspaceName.set($any($event.target).value)"
            (keyup.enter)="createProject(wsInput)"
            (keyup.escape)="workspace.toggleWorkspaceCreator()"
            placeholder="Project name…"
            aria-label="New project name"
            autofocus
          />
        </div>
      }
    </div>
  </div>
  
  <div class="sidebar-bottom">
    <a class="user-btn" routerLink="/profile" routerLinkActive="active" matRipple aria-label="Open your profile">
      <div class="user-info">
        <strong>{{ currentUser.name || 'Guest User' }}</strong>
        <small>{{ currentUser.email || 'Not signed in' }}</small>
      </div>
    </a>
  </div>
</aside>
