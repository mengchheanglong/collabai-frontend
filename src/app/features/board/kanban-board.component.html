<div class="kb" cdkDropListGroup role="region" aria-label="Kanban board">
  @for (column of tasks.columns; track column.key) {
    <section
      class="kb-column"
      [attr.data-column]="column.key"
      [attr.aria-label]="column.label + ' column'"
    >
      <header class="kb-column-head">
        <span class="kb-column-title">
          <span class="ui-dot" aria-hidden="true"></span>
          {{ column.label }}
        </span>
        <span class="ui-count">{{ tasks.tasksByStatus(column.key).length }}</span>
      </header>

      <div
        class="kb-column-body"
        cdkDropList
        [id]="'col-' + column.key"
        [cdkDropListData]="tasks.tasksByStatus(column.key)"
        [cdkDropListConnectedTo]="tasks.columnConnectedTo()"
        (cdkDropListDropped)="tasks.drop($event, column.key)"
        role="list"
        [attr.aria-label]="column.label + ' tasks'"
      >
        @for (task of tasks.tasksByStatus(column.key); track task.id) {
          <app-task-card
            cdkDrag
            [cdkDragData]="task"
            [task]="task"
            [selected]="tasks.selectedTask()?.id === task.id"
            (select)="tasks.selectTask($event)"
            role="listitem"
          />
        } @empty {
          <div class="kb-column-empty">
            <span class="material-symbols-rounded sm" aria-hidden="true">add</span>
            Drop tasks here
          </div>
        }
      </div>
    </section>
  }
</div>
