<div class="task-top">
  <span class="task-id">{{ task().id }}</span>
  <span class="pill" [class]="priorityClass(task().priority)">{{ task().priority }}</span>
</div>
<h3 [title]="task().title">{{ task().title }}</h3>
@if (task().labels.length) {
  <div class="tags">
    @for (tag of task().labels; track tag) {
      <span class="ai-chip sm" data-tone="default">{{ tag }}</span>
    }
  </div>
}
<footer>
  <span class="avatar sm" [style.background]="memberColor()(task().assigneeId || '')" [matTooltip]="task().assigneeId || ''" aria-hidden="true">
    {{ initials()(task().assigneeId || '') }}
  </span>
  <span class="meta">{{ task().dueDate }}</span>
  @if (task().comments) {
    <span class="meta" [attr.aria-label]="task().comments + ' comments'">
      <span class="material-symbols-rounded sm" aria-hidden="true">chat_bubble</span>
      {{ task().comments }}
    </span>
  }
</footer>
