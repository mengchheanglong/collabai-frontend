<div class="auth-page-compact">
  <div class="auth-card-compact">
    <div class="auth-compact-brand">
      <img src="/Collab%20AI.svg" alt="CollabAI" />
    </div>

    <div class="auth-compact-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="11" width="14" height="9" rx="2" stroke-width="1.6"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke-width="1.6"/>
      </svg>
    </div>

    <div class="auth-form-head-compact">
      <h1>Reset password</h1>
      <p class="auth-subtitle">Choose a new password for your account.</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label for="password">New password</label>
      <input id="password" type="password" formControlName="password" placeholder="At least 8 characters" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error"><i class="err-icon">!</i> Password must be at least 8 characters</span>
      }

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="Repeat password" />

      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" class="auth-submit" [disabled]="isLoading()">
        <span>{{ isLoading() ? 'Updating...' : 'Update password' }}</span>
      </button>
    </form>

    <p class="auth-links-compact">
      <a routerLink="/login">Back to login</a>
    </p>
  </div>
</div>
