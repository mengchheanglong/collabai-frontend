<div class="auth-shell">
  <main class="auth-card">
    <div class="auth-brand">
      <app-logo size="lg" />
    </div>

    <div class="auth-icon">
      <span class="material-symbols-rounded" aria-hidden="true">mark_email_read</span>
    </div>
    <div class="auth-head">
      <h1>Check your email</h1>
      @if (email()) {
        <p>
          A 6-digit verification code was sent to
          <strong class="auth-email">{{ email() }}</strong>.
        </p>
      } @else {
        <p>A 6-digit verification code was sent to your email. Enter it below to secure your account.</p>
      }
    </div>

    <div class="auth-otp">
      <app-otp-input (valueChange)="onCodeChange($event)" />
      @if (errorMessage()) {
        <p class="form-error" role="alert">{{ errorMessage() }}</p>
      }
      <button
        type="button"
        class="auth-submit"
        [disabled]="code().length !== 6 || state() === 'verifying'"
        (click)="submitCode()"
      >
        <span>{{ state() === 'verifying' ? 'Verifying…' : 'Verify email' }}</span>
        <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
      </button>
    </div>

    <p class="auth-links">Did not receive a code? <button type="button" class="auth-link" (click)="resendCode()">Resend</button></p>
  </main>
</div>
