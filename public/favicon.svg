<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1321"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="fav-primary" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="fav-spark" x1="32" y1="12" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- High contrast dark squircle container -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="rgba(255,255,255,0.12)"/>

  <!-- Collab C Ribbon -->
  <path
    d="M 45 13.5 C 26 7.5 12 18 12 32 C 12 46 26 56.5 45 50.5"
    stroke="url(#fav-primary)"
    stroke-width="6.8"
    stroke-linecap="round"
  />

  <!-- Team Member Synergy Nodes -->
  <circle cx="45" cy="13.5" r="4.8" fill="#38bdf8"/>
  <circle cx="45" cy="50.5" r="4.8" fill="#7c3aed"/>
  <circle cx="12" cy="32" r="3.5" fill="#2563eb"/>

  <!-- AI Sparkle Core -->
  <path
    d="M 40 32 C 40 26.8 43 22.5 48 22.5 C 43 22.5 40 18.2 40 13 C 40 18.2 37 22.5 32 22.5 C 37 22.5 40 26.8 40 32 Z"
    fill="url(#fav-spark)"
  />

  <!-- Secondary Accent Sparkle -->
  <path
    d="M 33 43 C 33 40.5 34.5 38.5 36.5 38.5 C 34.5 38.5 33 36.5 33 34 C 33 36.5 31.5 38.5 29.5 38.5 C 31.5 38.5 33 40.5 33 43 Z"
    fill="#818cf8"
  />
</svg>
